# Upstream SNN baseline recipe (examples/mswc_fscil/mswc_fscil.py, PRE_TRAIN branch) on our RSNN
# re-implementation (identical math); random initial state as upstream.
model: {name: rsnn, layer_sizes: [1024, 1024], dropout: 0.1, init_state: random}
loss: {name: ce}
train: {lr: 0.001, weight_decay: 0.0001, epochs: 50, schedule: step, step_size: 20, batch_size: 256, eval_every: 5}
